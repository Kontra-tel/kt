name: Release

on:
  push:
    tags:
      - v*

env:
  NFPM_VERSION: v2.47.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "${TAG}")"
          go run ./cmd/kt release validate "${TAG}" --github-output

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/release.sh

      - name: Verify binary artifacts
        run: |
          set -euo pipefail
          for artifact in dist/kt-linux-amd64 dist/kt-linux-arm64 dist/kt-darwin-amd64 dist/kt-darwin-arm64; do
            test -s "${artifact}"
          done

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}

      - name: Build Linux packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            cp "dist/kt-linux-${arch}" kt
            chmod +x kt
            ARCH=${arch} VERSION=${VERSION} nfpm package -f nfpm.yaml -p deb -t dist/
            ARCH=${arch} VERSION=${VERSION} nfpm package -f nfpm.yaml -p rpm -t dist/
            rm kt
          done

      - name: Verify package artifacts
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.deb' -size +0c | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.rpm' -size +0c | wc -l)" -eq 2

      - name: Update and verify checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum kt-* *.deb *.rpm > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Collect release notes
        run: go run ./cmd/kt release notes --since latest > /tmp/release-notes.txt

      - name: Create or update release and upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_JSON=/tmp/release.json
          if curl -fsS "${API_URL}/repos/${REPO}/releases/tags/${TAG}" -H "Authorization: token ${TOKEN}" > "${RELEASE_JSON}"; then RELEASE_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id', ''))" "${RELEASE_JSON}"); else RELEASE_ID=""; fi
          if [ -z "${RELEASE_ID}" ]; then
            curl -fsS -X POST "${API_URL}/repos/${REPO}/releases" -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" -d "$(python3 -c "import json, os; print(json.dumps({'tag_name': os.environ['TAG'], 'name': os.environ['TAG'], 'body': open('/tmp/release-notes.txt').read().strip(), 'prerelease': os.environ['PRERELEASE'].lower() == 'true'}))")" > "${RELEASE_JSON}"
            RELEASE_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "${RELEASE_JSON}")
          fi
          test -n "${RELEASE_ID}"
          for f in dist/kt-* dist/*.deb dist/*.rpm dist/SHA256SUMS; do
            [ -f "${f}" ] || continue
            NAME=$(basename "${f}")
            ASSET_ID=$(python3 -c "import json,sys; name=sys.argv[2]; data=json.load(open(sys.argv[1])); print(next((str(a['id']) for a in data.get('assets', []) if a.get('name') == name), ''))" "${RELEASE_JSON}" "${NAME}")
            if [ -n "${ASSET_ID}" ]; then curl -fsS -X DELETE "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets/${ASSET_ID}" -H "Authorization: token ${TOKEN}"; fi
            curl -fsS -X POST "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}" -H "Authorization: token ${TOKEN}" -H "Content-Type: application/octet-stream" --data-binary "@${f}"
          done
