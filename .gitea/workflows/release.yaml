name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./cmd/kt release validate "${TAG}" --github-output

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/release.sh

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build Linux packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            cp dist/kt-linux-${arch} kt
            chmod +x kt
            ARCH=${arch} VERSION=${VERSION} nfpm package -f nfpm.yaml -p deb -t dist/
            ARCH=${arch} VERSION=${VERSION} nfpm package -f nfpm.yaml -p rpm -t dist/
            rm kt
          done

      - name: Update checksums
        run: cd dist && sha256sum kt-* *.deb *.rpm > SHA256SUMS

      - name: Collect release notes
        run: go run ./cmd/kt release notes --since latest > /tmp/release-notes.txt

      - name: Create or update release and upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_JSON=/tmp/release.json
          if curl -sf "${API_URL}/repos/${REPO}/releases/tags/${TAG}" -H "Authorization: token ${TOKEN}" > "${RELEASE_JSON}"; then RELEASE_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id', ''))" "${RELEASE_JSON}"); else RELEASE_ID=""; fi
          if [ -z "$RELEASE_ID" ]; then
            curl -sf -X POST "${API_URL}/repos/${REPO}/releases" -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" -d "$(python3 -c "import json, os; print(json.dumps({'tag_name': os.environ['TAG'], 'name': os.environ['TAG'], 'body': open('/tmp/release-notes.txt').read().strip(), 'prerelease': os.environ['PRERELEASE'].lower() == 'true'}))")" > "${RELEASE_JSON}"
            RELEASE_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "${RELEASE_JSON}")
          fi
          for f in dist/kt-* dist/*.deb dist/*.rpm dist/SHA256SUMS; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            ASSET_ID=$(python3 -c "import json,sys; name=sys.argv[2]; data=json.load(open(sys.argv[1])); print(next((str(a['id']) for a in data.get('assets', []) if a.get('name') == name), ''))" "${RELEASE_JSON}" "$NAME")
            if [ -n "$ASSET_ID" ]; then curl -sf -X DELETE "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets/${ASSET_ID}" -H "Authorization: token ${TOKEN}"; fi
            curl -sf -X POST "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}" -H "Authorization: token ${TOKEN}" -H "Content-Type: application/octet-stream" --data-binary "@$f"
          done
